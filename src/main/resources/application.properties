# Nome da aplicação
spring.application.name=guapi-verde

# Servidor
server.port=8080

# Banco de dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5440/guapi_verde
spring.datasource.username=postgresql
spring.datasource.password=99590610
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.docker.compose.enabled=false

# Configurações de data e hora
spring.jackson.time-zone=America/Sao_Paulo

# Tratamento padrão de erros
server.error.include-stacktrace=never
server.error.include-message=always

# JWT (JSON Web Token)
# JWT
seguranca.jwt.chave=${JWT_CHAVE:guapi-verde-chave-jwt-segura-32-caracteres}
seguranca.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}
