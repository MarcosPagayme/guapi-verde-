# Nome da aplicação
spring.application.name=guapi-verde

# Servidor
server.port=8080

# Banco de dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5440/guapi_verde
spring.datasource.username=postgresql
spring.datasource.password=99590610
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA e Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.docker.compose.enabled=false

# Configurações de data e hora
spring.jackson.time-zone=America/Sao_Paulo

# CORS
aplicacao.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:5173,http://localhost:3000,http://localhost:8081,http://localhost:19006}

# Tratamento padrão de erros
server.error.include-stacktrace=never
server.error.include-message=always

# OpenAPI e Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

# JWT (JSON Web Token)
seguranca.jwt.chave=${JWT_CHAVE:guapi-verde-chave-jwt-segura-32-caracteres}
seguranca.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

# Administrador inicial
configuracao.admin.nome=${ADMIN_NOME:Administrador Guapi Verde}
configuracao.admin.email=${ADMIN_EMAIL:}
configuracao.admin.senha=${ADMIN_SENHA:}
